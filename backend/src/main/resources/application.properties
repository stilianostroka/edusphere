spring.application.name=edusphere

management.endpoints.web.exposure.include = *
management.info.env.enabled = true

info.app.name = EduSphere
info.app.description = School Management System
info.app.version = 1.0.0

spring.main.banner-mode=off

#logging.level.root=warn

# Database config
spring.datasource.url=jdbc:mysql://localhost:3306/edusphere
spring.datasource.username=edusphere
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT config
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# SMTP config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
app.mail.sender-name=EduSphere
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

