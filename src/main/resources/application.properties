spring.application.name=edusphere

# Use wildcard * to expose all endpoints
# Can also expose individual endpoints with ,
management.endpoints.web.exposure.include = *
management.info.env.enabled = true

info.app.name = EduSphere
info.app.description = School Management System
info.app.version = 1.0.0

#Turn off the spring boot banner in command line
spring.main.banner-mode=off

#Reduce logging level - Set logging to warn
#logging.level.root=warn

# Database config
spring.datasource.url=jdbc:mysql://localhost:3306/edusphere
spring.datasource.username=edusphere
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
